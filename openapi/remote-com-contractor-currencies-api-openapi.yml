openapi: 3.2.0
info:
  title: Remote Contractors Contractor Currencies API
  description: 'Manage contractors and Contractor-of-Record (COR) subscriptions on

    Remote.com.'
  version: '2026-05-22'
  contact:
    name: Remote API Support
    url: https://support.remote.com/
  x-logo:
    url: https://remote.com/favicon.ico
servers:
- url: https://gateway.remote.com/v1
  description: Production
- url: https://gateway.remote-sandbox.com/v1
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Contractor Currencies
  description: List currencies available for contractor payments
paths:
  /contractor_currencies:
    get:
      summary: List Contractor Currencies
      operationId: listContractorCurrencies
      tags:
      - Contractor Currencies
      responses:
        '200':
          description: Currencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyList'
components:
  schemas:
    Currency:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
    CurrencyList:
      type: object
      properties:
        data:
          type: object
          properties:
            currencies:
              type: array
              items:
                $ref: '#/components/schemas/Currency'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
