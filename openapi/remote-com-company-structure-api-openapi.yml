openapi: 3.1.0
info:
  title: Remote Benefits Benefit Offers Company Structure API
  description: 'List, select, and renew localized employee benefits across the countries

    Remote supports. Benefit offers and renewal requests use JSON Schema

    forms that vary per country and employment.

    '
  version: '2026-05-22'
  contact:
    name: Remote API Support
    url: https://support.remote.com/
  x-logo:
    url: https://remote.com/favicon.ico
servers:
- url: https://gateway.remote.com/v1
  description: Production
- url: https://gateway.remote-sandbox.com/v1
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Company Structure
  description: Reporting hierarchy and structure nodes for employees
paths:
  /company_structure_nodes:
    get:
      summary: List Company Structure Nodes
      operationId: listCompanyStructureNodes
      tags:
      - Company Structure
      parameters:
      - name: employment_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Structure nodes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
